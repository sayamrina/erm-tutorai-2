<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Opening ERM Tutor-AI 2</title>
<meta name="description" content="Wakes up the free server of ERM Tutor-AI 2 and opens the app when it is ready.">
<link rel="icon" href="img/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,600&family=Hanken+Grotesk:wght@400;600&display=swap" rel="stylesheet">
<style>
:root { --paper: #f2f5f4; --grid: #e0e7e5; --surface: #fff; --ink: #172631; --ink-2: #4a5a66; --line: #d3dcda; --blue: #1a629b; --blue-ink: #124a75; --evidence: #0e7c6b; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --paper: #0f1a21; --grid: #17252e; --surface: #13202a; --ink: #e3ebe9; --ink-2: #aab8bf; --line: #253540; --blue: #5d9fd8; --blue-ink: #8bbbe4; --evidence: #45bba3; }
}
* { box-sizing: border-box; }
body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px;
  background-color: var(--paper); color: var(--ink); font: 16px/1.55 "Hanken Grotesk", system-ui, sans-serif;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 24px 24px; }
main { width: min(460px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 28px; box-shadow: 0 18px 40px rgba(23, 38, 49, .10); }
.brand { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
.brand img { width: 40px; height: 40px; border-radius: 8px; }
h1 { font: 600 26px/1.15 "Source Serif 4", Georgia, serif; margin: 0; }
p { margin: 0 0 14px; color: var(--ink-2); }
.track { height: 6px; border-radius: 3px; background: var(--grid); overflow: hidden; margin: 18px 0 10px; }
.track i { display: block; height: 100%; width: 0; background: var(--evidence); transition: width .6s linear; }
#status { font-size: 14px; }
a { color: var(--blue); font-weight: 600; }
.ready a { display: inline-block; margin-top: 4px; padding: 10px 16px; background: var(--blue-ink); color: #fff; border-radius: 8px; text-decoration: none; }
@media (prefers-reduced-motion: reduce) { .track i { transition: none; } }
</style>
</head>
<body>
<main>
  <div class="brand"><img src="img/logo.png" alt=""><h1>Opening ERM Tutor-AI 2</h1></div>
  <p>The app runs on a free server that sleeps when nobody uses it. Waking it up takes up to a minute; the app opens by itself when it is ready.</p>
  <div class="track" aria-hidden="true"><i id="bar"></i></div>
  <p id="status" role="status">Waking up the server…</p>
  <p id="fallback" hidden>Taking longer than usual. <a href="https://erm-tutorai-2.onrender.com/">Open the app directly</a> or try again in a minute.</p>
</main>
<script>
const APP = "https://erm-tutorai-2.onrender.com/";
const started = Date.now();
const bar = document.getElementById("bar"), status = document.getElementById("status");
const tick = setInterval(() => {
  const s = (Date.now() - started) / 1000;
  bar.style.width = Math.min(95, s * 1.6) + "%";
  status.textContent = `Waking up the server… ${Math.round(s)} s`;
  if (s > 90) document.getElementById("fallback").hidden = false;
}, 1000);
async function poll() {
  try {
    const r = await fetch(APP + "api/health", { cache: "no-store" });
    if (r.ok) {
      clearInterval(tick);
      bar.style.width = "100%";
      status.textContent = "Ready. Opening the app…";
      location.replace(APP);
      return;
    }
  } catch { /* still asleep */ }
  setTimeout(poll, 3000);
}
poll();
</script>
</body>
</html>
